name: Monitoring Infrastructure Pipeline

on:
  pull_request:
    branches: [main]
    paths:
      - 'infra/monitoring/**'
  push:
    branches: [main]
    paths:
      - 'infra/monitoring/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# Serialise runs of the same workflow on the same ref. cancel-in-progress is
# false on purpose: cancelling mid `terraform apply` can leave the state locked
# or the stack half-applied.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: "Terraform Plan (Monitoring)"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Configure AWS Credentials (Plan Role)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/smart-helmet-tf-plan-role
          role-session-name: GHActionsMonitoringPlan

      - name: Terraform Format Check
        run: terraform fmt -check -diff
        working-directory: ./infra/monitoring

      - name: Terraform Init
        run: terraform init -input=false
        working-directory: ./infra/monitoring

      - name: Terraform Validate
        run: terraform validate
        working-directory: ./infra/monitoring

      - name: Terraform Plan
        run: terraform plan -input=false -var="sns-email-address=${{ vars.SNS_EMAIL_ADDRESS }}"
        working-directory: ./infra/monitoring

  apply:
    name: "Terraform Apply (Monitoring)"
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Configure AWS Credentials (Deploy Role)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/smart-helmet-tf-deploy-role
          role-session-name: GHActionsMonitoringApply

      - name: Terraform Init
        run: terraform init -input=false
        working-directory: ./infra/monitoring

      - name: Terraform Format Check
        run: terraform fmt -check -diff
        working-directory: ./infra/monitoring

      - name: Terraform Validate
        run: terraform validate
        working-directory: ./infra/monitoring

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve -var="sns-email-address=${{ vars.SNS_EMAIL_ADDRESS }}"
        working-directory: ./infra/monitoring
