name: Deploy Alert Handler Service

on:
  push:
    branches: [main]
    paths:
      - 'services/alert-handler/**'
      - '!services/alert-handler/infra/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# Serialise runs of the same workflow on the same ref. cancel-in-progress is
# false on purpose: cancelling mid `terraform apply` can leave the state locked
# or the stack half-applied.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: "Build & Deploy Alert Handler"
    # workflow_dispatch lets you pick any branch; only ever deploy from main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/smart-helmet-app-deploy-role
          role-session-name: GHActionsAlertDeploy

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Build Docker Image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: smart-helmet-alert-service-repo
          # Not a bare commit SHA: re-running this workflow for the same commit
          # would push an identical tag, which fails once the repository is
          # IMMUTABLE.
          IMAGE_TAG: ${{ github.sha }}-${{ github.run_number }}
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" services/alert-handler
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Scan Image (trivy)
        run: |
          curl -fsSL -o trivy.tar.gz \
            https://github.com/aquasecurity/trivy/releases/download/v0.76.0/trivy_0.76.0_Linux-64bit.tar.gz
          tar -xzf trivy.tar.gz trivy
          # Scan before pushing, so a vulnerable image never reaches ECR.
          # --ignore-unfixed fails only on CVEs that have a fix available.
          # Accepted findings live in .trivyignore (auto-discovered).
          ./trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            "${{ steps.build-image.outputs.image }}"

      - name: Push to ECR
        run: docker push "${{ steps.build-image.outputs.image }}"

      - name: Download Active Task Definition from AWS
        run: |
          aws ecs describe-task-definition \
            --task-definition smart-helmet-alerts-task \
            --query taskDefinition > task-definition.json

      - name: Render New Image Tag
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@8d79160660ad39c402a16e5fc7cd2a32e8f7d6b7 # v1.9.1
        with:
          task-definition: task-definition.json
          container-name: alerts-container
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy to Amazon ECS Fargate
        uses: aws-actions/amazon-ecs-deploy-task-definition@a00d4d57ac0de1a99b39fe469f3d898d38717c2b # v2.6.4
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: smart-helmet-alerts-service
          cluster: smart-helmet-cluster
          wait-for-service-stability: true
