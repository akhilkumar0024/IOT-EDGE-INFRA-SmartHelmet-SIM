name: Lint & Static Checks

# Deliberately has no path filters: this is the one workflow that validates the
# workflow files themselves, so it must run when they change. It is also cheap
# (no AWS, no Docker builds).
#
# Note it runs on push as well as PR. Because this repo commits straight to
# main, the push run is advisory - the gate only actually blocks once branch
# protection is enabled.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Read-only: nothing here assumes an AWS role or mutates anything.
permissions:
  contents: read

# Safe to cancel in progress here - this workflow holds no state lock.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (ruff + pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # Pinned so CI lints identically to a local run.
      - name: Install tools
        run: pip install "ruff==0.17.1" "pip-audit==2.10.1"

      - name: Lint
        run: ruff check services simulator

      - name: Format check
        run: ruff format --check services simulator

      # Dependabot opens the PRs; pip-audit is what fails the build if a known
      # vulnerability is actually reachable from these requirements.
      - name: Dependency audit
        run: |
          for r in services/*/src/requirements.txt; do
            echo "--- $r"
            pip-audit --strict -r "$r"
          done

  dockerfiles:
    name: Dockerfiles (hadolint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install hadolint
        run: |
          curl -fsSL -o /usr/local/bin/hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-Linux-x86_64
          chmod +x /usr/local/bin/hadolint
          hadolint --version

      - name: Lint Dockerfiles
        run: hadolint services/*/Dockerfile

  shell:
    name: Shell scripts (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # shellcheck is pre-installed on the ubuntu runners, but it is only ever
      # reached indirectly through actionlint's `run:` analysis. Standalone
      # scripts under Scripts/ would otherwise have no coverage at all.
      - name: shellcheck
        run: shellcheck -s bash Scripts/*.sh

  iac:
    name: IaC (trivy config)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install trivy
        run: |
          curl -fsSL -o trivy.tar.gz \
            https://github.com/aquasecurity/trivy/releases/download/v0.76.0/trivy_0.76.0_Linux-64bit.tar.gz
          tar -xzf trivy.tar.gz trivy
          ./trivy --version

      # Accepted findings are recorded in .trivyignore (auto-discovered), each
      # with the reason it is accepted. Anything new fails.
      - name: Scan Terraform and Dockerfiles
        run: ./trivy config --severity HIGH,CRITICAL --exit-code 1 --skip-dirs .terraform .

  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the interesting leaks are the ones already committed,
          # not the ones in the working tree.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -fsSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: Scan git history
        run: ./gitleaks git --no-banner --redact --exit-code 1 .

  workflows:
    name: Workflows (actionlint + yamllint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install actionlint
        run: |
          curl -fsSL -o actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint --version

      # shellcheck is present on the runner, so actionlint will analyse every
      # `run:` block as well as the workflow structure.
      - name: actionlint
        run: ./actionlint -color

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: yamllint
        run: |
          pip install "yamllint==1.38.0"
          yamllint .
