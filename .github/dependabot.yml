# Dependabot configuration.
#
# Actions are pinned to commit SHAs, which is only maintainable if something
# advances the pins - without this they rot silently. Dependabot rewrites both
# the SHA and the version comment in `uses: owner/repo@<sha> # vX.Y.Z`.
#
# Weekly with a low open-PR limit: this is a portfolio project, not something
# with an on-call rota.
#
# `groups` collapses the per-directory fan-out into one reviewable PR. `ignore`
# is used only where a bump was verified not to be mergeable yet - Dependabot
# does not treat the constraint in `required_providers` as a fence.

version: 2
updates:
  # ---------------------------------------------------------------- actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    open-pull-requests-limit: 5
    groups:
      # Without this, five actions means five PRs. Majors are deliberately NOT
      # ignored here: the runner now forces these actions off Node.js 20 onto
      # Node.js 24, so the upgrades are becoming necessary rather than optional.
      actions:
        patterns:
          - "*"

  # ------------------------------------------------------------------- pip
  # One entry per requirements.txt - Dependabot resolves a single directory.
  - package-ecosystem: pip
    directory: /services/telemetry-processor/src
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 3
    groups:
      python-deps:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /services/processing-engine/src
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 3
    groups:
      python-deps:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /services/alert-handler/src
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 3
    groups:
      python-deps:
        patterns:
          - "*"

  # ---------------------------------------------------------------- docker
  # Tracks the base image tag in each Dockerfile (python:3.11-slim).
  - package-ecosystem: docker
    directory: /services/telemetry-processor
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 3
    ignore:
      # `python:3.11-slim` is a *floating* tag - Debian security fixes arrive on
      # any rebuild, so holding the tag line at 3.11 does not hold back patches.
      # Moving 3.11 -> 3.14 is a runtime migration: it needs a wheel-availability
      # check, a deploy smoke test, and a fresh .trivyignore baseline.
      # Remove this rule when that migration is actually scheduled.
      - dependency-name: "python"

  - package-ecosystem: docker
    directory: /services/processing-engine
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "python"

  - package-ecosystem: docker
    directory: /services/alert-handler
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "python"

  # ------------------------------------------------------------- terraform
  # One entry per stack; the hashicorp/aws provider is pinned with "~> 5.0" in
  # every provider.tf. Stacks cannot be collapsed with a glob: each carries its
  # own .terraform.lock.hcl.
  - package-ecosystem: terraform
    directory: /infra/platform
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 3
    groups:
      terraform-providers:
        patterns:
          - "*"
    ignore:
      # hashicorp/aws 5.x -> 6.x is a breaking major: credentials, init and
      # validate all succeed, then `terraform plan` fails. Remove this rule when
      # the migration is scheduled.
      - dependency-name: "hashicorp/aws"
        update-types:
          - version-update:semver-major

  - package-ecosystem: terraform
    directory: /infra/shared-data
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 3
    groups:
      terraform-providers:
        patterns:
          - "*"
    ignore:
      - dependency-name: "hashicorp/aws"
        update-types:
          - version-update:semver-major

  - package-ecosystem: terraform
    directory: /infra/messaging
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 3
    groups:
      terraform-providers:
        patterns:
          - "*"
    ignore:
      - dependency-name: "hashicorp/aws"
        update-types:
          - version-update:semver-major

  - package-ecosystem: terraform
    directory: /infra/monitoring
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 3
    groups:
      terraform-providers:
        patterns:
          - "*"
    ignore:
      - dependency-name: "hashicorp/aws"
        update-types:
          - version-update:semver-major

  - package-ecosystem: terraform
    directory: /services/telemetry-processor/infra
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 3
    groups:
      terraform-providers:
        patterns:
          - "*"
    ignore:
      - dependency-name: "hashicorp/aws"
        update-types:
          - version-update:semver-major

  - package-ecosystem: terraform
    directory: /services/processing-engine/infra
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 3
    groups:
      terraform-providers:
        patterns:
          - "*"
    ignore:
      - dependency-name: "hashicorp/aws"
        update-types:
          - version-update:semver-major

  - package-ecosystem: terraform
    directory: /services/alert-handler/infra
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 3
    groups:
      terraform-providers:
        patterns:
          - "*"
    ignore:
      - dependency-name: "hashicorp/aws"
        update-types:
          - version-update:semver-major
